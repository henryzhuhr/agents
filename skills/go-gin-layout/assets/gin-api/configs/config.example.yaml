# 本地开发配置示例。复制为 configs/config.yaml 后按需修改。
http:
  addr: 127.0.0.1:8080

infra:
  mysql:
    host: 127.0.0.1
    port: 3307
    user: root
    password: root
    database: gin_layout
    params:
      charset: utf8mb4
    pool:
      max_open_conns: 20
      max_idle_conns: 5
      conn_max_lifetime: 3m
      ping_timeout: 3s

log_level: info
